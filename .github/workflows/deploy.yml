name: EDULINK CI/CD (npm)

# Pull-based deploy: the runner does nothing but SSH in and tell the server
# to fetch + reset to the pushed branch, then build and reload PM2 there.
# Reuses the same SERVER_IP/SERVER_USER/SSH_PRIVATE_KEY secrets as the
# backend workflow.
#
# One-time setup this depends on, on the server:
#   - /var/www/edulink is already `git clone`d from this repo
#   - /var/www/edulink/.env.production exists and is populated
#     (NOT committed — .gitignore excludes .env*, so it must be placed
#     there manually and kept up to date by hand)
#   - /var/www/edulink/ecosystem.config.js is present (committed)

on:
  push:
    branches: [develop, master]

jobs:
  deploy:
    name: Deploy Frontend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_BRANCH
          script: |
            set -e

            echo "Deploying branch: $GITHUB_BRANCH"

            # NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            echo "Go to project folder"
            cd /var/www/edulink

            echo "Check .env.production"
            if [ ! -f .env.production ]; then
              echo ".env.production not found on server"
              exit 1
            fi

            echo "Fetch latest code"
            git fetch origin "$GITHUB_BRANCH"

            echo "Clean untracked files but keep .env.production"
            git clean -fd -e .env.production

            echo "Reset to latest $GITHUB_BRANCH"
            git reset --hard "origin/$GITHUB_BRANCH"

            echo "Install dependencies"
            npm ci

            echo "Build Next.js app"
            npm run build

            echo "Reload PM2"
            pm2 reload ecosystem.config.js --update-env || pm2 start ecosystem.config.js --update-env

            echo "Save PM2 state"
            pm2 save

            echo "Deploy completed successfully"
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
